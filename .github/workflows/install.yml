name: check flake
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 🧹 Format and lint (tool versions from flake.lock)
        shell: nix shell --inputs-from . nixpkgs#nixfmt nixpkgs#statix nixpkgs#deadnix nixpkgs#shellcheck --command bash -euo pipefail {0}
        run: |
          git ls-files -z "*.nix" | xargs -0 nixfmt --check
          statix check .
          deadnix --fail .
          shellcheck install.sh pkgs/scripts/*.sh config/quickshell/menus/*.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 🛠️ Check flake
        run: nix flake check --no-build
      - name: 🏠 Evaluate Home-Manager configurations
        run: |
          for config in headless headless_aarch64 desktop runner; do
            echo "Evaluating $config"
            nix eval --raw ".#homeConfigurations.$config.activationPackage.drvPath"
            echo
          done
