name: check flake
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 🧹 Format and lint (check.sh; tool versions from flake.lock)
        run: ./check.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 🛠️ Check flake
        run: nix flake check --no-build
      - name: 🏠 Evaluate Home Manager configurations
        run: |
          for config in headless headless_aarch64 desktop desktop_aarch64 runner; do
            echo "Evaluating $config"
            nix eval --raw ".#homeConfigurations.$config.activationPackage.drvPath"
            echo
          done
