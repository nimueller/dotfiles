name: check flake
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 🧹 Format and lint (check.sh; tool versions from flake.lock)
        run: ./check.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 🛠️ Check flake and evaluate the Home Manager configurations
        run: .github/check-flake.sh
