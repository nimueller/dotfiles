name: lgtm
on:
  issue_comment:
    types: [created]

# A comment that says exactly "@claude lgtm" on a pull request, written by the
# repository's owner, squashes it onto its base branch once the checks pass,
# and deletes the branch:
# - It waits for the checks of the pull request except "check flake"
#   (install.yml); a failed one stops it.
# - It rebases the branch onto its base if the base moved on, and runs the
#   checks of install.yml itself on exactly the commit it squashes: results
#   from before a rebase may be outdated either way, and pushes of the workflow
#   token start no workflows. If the base moves on during that, once more, up
#   to three times. So the squash commit has exactly the tested content on top
#   of the tested base, and the history stays linear.
# - Pull requests stacked on this one (based on its branch) are rebased onto
#   the base branch and retargeted to it before the branch is deleted.
# On a failure it comments why and doesn't merge.
# No Claude involved: claude.yml skips these comments. Anything after "lgtm"
# doesn't merge, so "@claude lgtm, but ..." can't merge by accident.
#
# Like updater.yml, it needs "Read and write permissions" for workflows in the
# repository settings (Actions > General > Workflow permissions). The workflow
# token may not push or merge changes to workflow files: such pull requests
# need a manual merge.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lgtm-${{ github.event.issue.number }}

jobs:
  merge:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '@claude lgtm')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 💬 Only exactly "@claude lgtm"
        id: comment
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
        run: |
          body=$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "${body,,}" != "@claude lgtm" ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown
            gh pr comment "$PR" --body 'Not merged: only a comment of exactly `@claude lgtm` merges.'
            exit 0
          fi
          gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=+1 >/dev/null
          echo "merge=true" >>"$GITHUB_OUTPUT"

      - name: ⏳ Wait for the other checks of the pull request
        if: steps.comment.outputs.merge == 'true'
        id: checks
        run: |
          fail() {
            gh pr comment "$PR" --body "Not merged: $1 ($RUN_URL)"
            exit 1
          }
          read -r head base ref < <(gh pr view "$PR" --json headRefOid,baseRefName,headRefName -q '"\(.headRefOid) \(.baseRefName) \(.headRefName)"')
          # "check flake" runs below on the commit that gets squashed
          others='[.[] | select(.workflow != "check flake")]'
          # An hour at most; checks of a fresh push may take a moment to show up
          start=$SECONDS
          while :; do
            checks=$(gh pr checks "$PR" --json name,bucket,workflow 2>/dev/null || true)
            [ -n "$checks" ] || checks='[]'
            failed=$(jq -r "$others | map(select(.bucket == \"fail\" or .bucket == \"cancel\") | .name) | join(\", \")" <<<"$checks")
            [ -z "$failed" ] || fail "checks failed: $failed."
            pending=$(jq "$others | map(select(.bucket == \"pending\")) | length" <<<"$checks")
            if [ "$pending" = 0 ] && { [ "$(jq length <<<"$checks")" -gt 0 ] || [ $((SECONDS - start)) -ge 120 ]; }; then
              break
            fi
            [ $((SECONDS - start)) -lt 3600 ] || fail "the checks didn't finish within an hour."
            sleep 30
          done
          [ "$(gh pr view "$PR" --json headRefOid -q .headRefOid)" = "$head" ] ||
            fail "new commits arrived while waiting for the checks; comment again."
          {
            echo "head=$head"
            echo "base=$base"
            echo "ref=$ref"
          } >>"$GITHUB_OUTPUT"

      - name: 🔍 Checkout repository
        if: steps.comment.outputs.merge == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.comment.outputs.merge == 'true'
        uses: cachix/install-nix-action@v31

      - name: 🚀 Rebase if needed, check and squash
        if: steps.comment.outputs.merge == 'true'
        env:
          HEAD_SHA: ${{ steps.checks.outputs.head }}
          BASE: ${{ steps.checks.outputs.base }}
          REF: ${{ steps.checks.outputs.ref }}
        run: |
          fail() {
            gh pr comment "$PR" --body "Not merged: $1 ($RUN_URL)"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sha=$HEAD_SHA
          for _ in 1 2 3; do
            git fetch -q origin "$BASE"
            base_sha=$(git rev-parse FETCH_HEAD)
            git checkout -q --detach "$sha"
            if ! git merge-base --is-ancestor "$base_sha" "$sha"; then
              if ! git rebase -q "$base_sha"; then
                git rebase --abort
                fail "rebasing onto $BASE failed, probably a conflict; rebase the branch yourself and comment again."
              fi
              git push -q --force-with-lease="$REF:$sha" origin "HEAD:refs/heads/$REF" ||
                fail "pushing the branch rebased onto $BASE failed (changes to workflow files have to be merged by hand)."
              sha=$(git rev-parse HEAD)
            fi
            ./check.sh || fail "check.sh failed on the commit to squash."
            .github/check-flake.sh || fail "the flake check failed on the commit to squash."
            # The base moved on during the checks: once more
            [ "$(git ls-remote origin "refs/heads/$BASE" | cut -f1)" = "$base_sha" ] || continue
            # The pull request may need a moment to see a pushed rebase
            for _ in $(seq 30); do
              [ "$(gh pr view "$PR" --json headRefOid -q .headRefOid)" = "$sha" ] && break
              sleep 2
            done
            gh pr merge "$PR" --squash --match-head-commit "$sha" ||
              fail "merging failed; were there new commits?"
            exit 0
          done
          fail "$BASE kept moving on, three rebases in a row were outdated after their checks; comment again."

      - name: 🪜 Move stacked pull requests onto the base and delete the branch
        if: steps.comment.outputs.merge == 'true'
        env:
          HEAD_SHA: ${{ steps.checks.outputs.head }}
          BASE: ${{ steps.checks.outputs.base }}
          REF: ${{ steps.checks.outputs.ref }}
        run: |
          git fetch -q origin "$BASE"
          new_base=$(git rev-parse FETCH_HEAD)
          while read -r num ref sha; do
            git fetch -q origin "$sha"
            # Its commits after those of the merged branch (as it was before a rebase above)
            upstream=$(git merge-base "$sha" "$HEAD_SHA")
            git checkout -q --detach "$sha"
            # Retarget first: deleting the branch would otherwise close it
            gh pr edit "$num" --base "$BASE"
            if git rebase -q --onto "$new_base" "$upstream" &&
              git push -q --force-with-lease="$ref:$sha" origin "HEAD:refs/heads/$ref"; then
              gh pr comment "$num" --body "#$PR was squashed onto \`$BASE\`; this branch is rebased onto it now. Its \"check flake\" checks don't rerun for this push; \`@claude lgtm\` runs them itself."
            else
              git rebase --abort 2>/dev/null || true
              gh pr comment "$num" --body "#$PR was squashed onto \`$BASE\`, but rebasing this branch onto it failed; rebase it yourself: \`git rebase --onto origin/$BASE $upstream $ref\` ($RUN_URL)"
            fi
          done < <(gh pr list --base "$REF" --state open --json number,headRefName,headRefOid -q '.[] | "\(.number) \(.headRefName) \(.headRefOid)"')
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$REF"
