# The headset stand registers as a USB sound card because of its 3.5 mm jack.
# Nothing is plugged into it, so it would only show up as a useless output
# and input; disable it as a whole.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1b1c"
        device.product.id = "0x0a32"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
