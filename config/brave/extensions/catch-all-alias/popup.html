<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; width: 330px; margin: 0; padding: 12px; color: #111827; background: #fff; }
  h1 { font-size: 13px; margin: 0 0 8px; color: #4b5563; font-weight: 600; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  code { flex: 1; font: 13px ui-monospace, Menlo, Consolas, monospace; background: #f3f4f6; padding: 6px 8px; border-radius: 6px; word-break: break-all; color: #1d4ed8; }
  button { font: inherit; font-size: 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  button:hover { background: #f3f4f6; }
  .muted { color: #6b7280; font-size: 12px; }
  .sec { margin-top: 12px; }
  a { color: #2563eb; text-decoration: none; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    body { background:#1f2937; color:#f9fafb; }
    code { background:#111827; color:#93c5fd; }
    button { background:#374151; color:#f9fafb; border-color:#4b5563; }
    .muted, h1 { color:#9ca3af; }
    a { color:#93c5fd; }
  }
</style>
</head>
<body>
  <h1 id="title">Alias</h1>
  <div class="row"><code id="fresh">…</code><button id="copy">Copy</button><button id="reroll" title="Reroll">↻</button></div>
  <div class="sec" id="savedSec" hidden>
    <h1>Used on this site before</h1>
    <div id="saved"></div>
  </div>
  <div class="sec row">
    <span class="muted" id="status"></span>
    <span style="margin-left:auto"></span>
    <a href="options.html" target="_blank">Settings &amp; all aliases</a>
  </div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
