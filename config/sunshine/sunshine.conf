output_name = DP-1
# Capture over wlroots screencopy only. Auto-detection also probes the XDG
# screencast portal at startup, before the lock screen at login is unlocked:
# xdg-desktop-portal-hyprland then waits for its share picker, which nobody
# sees behind the lock screen, and answers no other app until it's closed
# (Brave and KeePassXC each waited 25 s for the portal after unlocking).
capture = wlr
global_prep_cmd = [{"do":"stay-awake on sunshine Streaming","undo":"stay-awake off sunshine","elevated":false}]
