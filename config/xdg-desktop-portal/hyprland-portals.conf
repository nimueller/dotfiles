# Which portal backend answers which request under Hyprland. Files are picked
# with Nautilus' own file chooser (GTK4, its sidebar, search and thumbnails)
# instead of GTK3's old dialog. Under GNOME, xdg-desktop-portal-gnome forwards
# to it, but outside of GNOME Shell that portal only offers settings, so
# nautilus.portal registers Nautilus as a backend directly.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=nautilus
