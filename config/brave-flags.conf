--enable-features=UseOzonePlatform,WaylandLinuxDrmSyncobj
--ozone-platform=wayland
# Ignore the compositor's display scale and draw at 1:1.
--force-device-scale-factor=1
# TODO: remove once Brave fixes it (README, TODO). Brave decodes YouTube's 4K VP9
# in software (it skips NVIDIA for VA-API) and copies the frames into GPU buffers;
# at 3840x2160 that copy crashes the tab ("Aw, Snap!", error code 5) on Wayland
# with NVIDIA. 1440p is fine. Found 2026-10 with Brave 1.97.56, driver 615.78.08.
# Recheck after Brave updates: drop the flag, restart Brave, play a video at 2160p.
--disable-gpu-memory-buffer-video-frames
