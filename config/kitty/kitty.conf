# kitty: only what differs from the defaults (kitty +runpy 'from kitty.config
# import *; print(commented_out_default_config())' prints all options).

# Font
font_family      NotoMono Nerd Font
font_size        14.0

# Colours: kitty's default palette on a dark grey background
foreground #E3E0E6
background #1A1A1D

# Window
window_padding_width 20
remember_window_size no

# Selecting copies to the clipboard; trailing spaces are dropped on copy
copy_on_select        clipboard
strip_trailing_spaces smart

# Zsh from Home Manager
shell /home/$USER/.nix-profile/bin/zsh

# Remote control, used by zen-mode.nvim to enlarge the font
allow_remote_control socket-only
listen_on            unix:/tmp/kitty
