# Night light (hyprsunset, its systemd user service from the package): warmer
# colours from 21:00, back to normal at 7:00. The system menu
# (quickshell/menus/system.qml) turns it on or off by hand over hyprctl, until
# the next of these times; it uses the same temperature.

profile {
    time = 7:00
    identity = true
}

profile {
    time = 21:00
    temperature = 4500
}
