# Idle handling (hypridle, started in autostart.lua):
#   9:30  a notice that the screen locks soon
#   10:00 lock (hyprlock)
#   15:00 monitors off, on again with any input
# The session also locks before every suspend; suspend waits until the lock
# screen is up. Apps that keep the screen awake (videos, games) hold all of
# this off.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
}

listener {
    timeout = 570
    on-timeout = notify-send -e -u low -a Idle -i system-lock-screen "Locking in 30 seconds" "Move the mouse or press a key to stay"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
