# Idle handling (hypridle, started in autostart.lua):
#   9:30  a notice that the screen locks soon
#   10:00 lock (hyprlock)
#   15:00 monitors off, on again with any input
# Laptops (laptop-idle, only in the laptop mode, config/hypr/modes.lua) also
# dim the backlight along with the notice, back with any input, and at 15:00
# suspend when on battery.
# The session also locks before every suspend; suspend waits until the lock
# screen is up. All of this waits while something keeps the screen awake:
# a playing video, a game or a Sunshine stream (quickshell/menus/StayAwake.qml,
# the stay-awake script), or an app's own inhibitor.

general {
    lock_cmd = lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
}

listener {
    timeout = 570
    on-timeout = notify-send -e -u low -a Idle -i system-lock-screen "Locking in 30 seconds" "Move the mouse or press a key to stay"
}

listener {
    timeout = 570
    on-timeout = laptop-idle dim
    on-resume = laptop-idle undim
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = laptop-idle suspend
}
