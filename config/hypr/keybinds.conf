$mainMod = SUPER
$resizeStep = 50

exec = hyprctl dispatch submap global
submap = global

# Launcher
bind = $mainMod, D, exec, applauncher

# Brightness
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media
bindl = , XF86AudioPlay, exec, playerctl -p chromium,%any play-pause
bindl = , XF86AudioPause, exec, playerctl -p chromium,%any pause
bindl = , XF86AudioNext, exec, playerctl -p chromium,%any next
bindl = , XF86AudioPrev, exec, playerctl -p chromium,%any previous
bindl = , XF86AudioStop, exec, playerctl -p chromium,%any stop
bind = ,XF86Calculator, exec, gnome-calculator

# Volume
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Workspace controls
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special Workspaces
bind = $mainMod, S, togglespecialworkspace, music
bind = $mainMod, C, togglespecialworkspace, chat
bind = $mainMod, P, togglespecialworkspace, passwords

# Generic
bind = ALT, F4, killactive,
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, M, fullscreen, 0
bind = , F11, fullscreen, 0

# Move/resize windows with keyboard and mouse
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, up, resizeactive, 0 -$resizeStep
bind = $mainMod, down, resizeactive, 0 $resizeStep
bind = $mainMod, left, resizeactive, -$resizeStep 0
bind = $mainMod, right, resizeactive, $resizeStep 0
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Utilities
bind = $mainMod SHIFT, S, exec, hyprshot -o $HOME/Pictures/Screenshots/ -m region
bind = $mainMod CONTROL SHIFT, S, exec, hyprshot -o $HOME/Pictures/Screenshots/ -m window
bind = Super+Shift, C, exec, hyprpicker -a  # Colour picker

bind = $mainMod, semicolon, exec, wtype 'ö'
bind = $mainMod SHIFT, semicolon, exec, wtype 'Ö'
bind = $mainMod, bracketleft, exec, wtype 'ü'
bind = $mainMod SHIFT, bracketleft, exec, wtype 'Ü'
bind = $mainMod, apostrophe, exec, wtype 'ä'
bind = $mainMod SHIFT, apostrophe, exec, wtype 'Ä'
bind = $mainMod, minus, exec, wtype 'ß'

bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | tee >(wtype -) | wl-copy

# Program shortcuts
bind = $mainMod, T, exec, kitty
bind = $mainMod, E, exec, [float] nautilus
bind = $mainMod SHIFT, E, exec, nautilus
bind = $mainMod, B, exec, zen-browser
