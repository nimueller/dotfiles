# Lock screen (hyprlock) in Catppuccin Macchiato, like the rest of the desktop.
# hypridle starts it after 10 minutes idle and before suspend (hypridle.conf);
# SUPER + Escape locks right away.

$text = rgb(cad3f5)
$subtext1 = rgb(b8c0e0)
$subtext0 = rgb(a5adcb)
$overlay0 = rgb(6e738d)
$base = rgba(24273aee)
$lavender = rgb(b7bdf8)
$peach = rgb(f5a97f)
$yellow = rgb(eed49f)
$red = rgb(ed8796)
$font = CaskaydiaCove Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

# The screen as it was, blurred and darkened
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.5
    contrast = 0.9
    vibrancy = 0.2
}

# Clock and date
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $text
    font_size = 110
    font_family = $font ExtraLight
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext1
    font_size = 20
    font_family = $font
    position = 0, 125
    halign = center
    valign = center
    shadow_passes = 2
}

# Avatar and greeting
image {
    monitor =
    path = ~/.face
    size = 112
    rounding = -1
    border_size = 3
    border_color = $lavender
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = $subtext0
    font_size = 14
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = $lavender
    inner_color = $base
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">󰌾   Password</span>
    check_color = $peach
    fail_color = $red
    fail_text = <span foreground="##ed8796">$FAIL ($ATTEMPTS)</span>
    capslock_color = $yellow
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 2
}

# What's playing, if anything
label {
    monitor =
    text = cmd[update:2000] playerctl metadata title 2>/dev/null | sed 's/&/\&amp;/g; s/</\&lt;/g; s/^/󰎆   /'
    color = $overlay0
    font_size = 12
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
