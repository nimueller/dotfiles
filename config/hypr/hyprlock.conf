# Lock screen (hyprlock) in Catppuccin Macchiato, like the rest of the desktop.
# hypridle starts it after 10 minutes idle and before suspend (hypridle.conf);
# SUPER + Escape locks right away.

$text = rgb(cad3f5)
$subtext1 = rgb(b8c0e0)
$subtext0 = rgb(a5adcb)
$overlay0 = rgb(6e738d)
$base = rgba(24273aee)
$lavender = rgb(b7bdf8)
$peach = rgb(f5a97f)
$yellow = rgb(eed49f)
$red = rgb(ed8796)
$font = CaskaydiaCove Nerd Font

general {
    # Shown: with a hidden cursor hyprlock ignores every click, also the
    # keyboard button's (touch mode hides it after a touch anyway)
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

# The screen as it was, blurred and darkened
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.5
    contrast = 0.9
    vibrancy = 0.2
}

# Clock and date
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $text
    font_size = 110
    font_family = $font ExtraLight
    position = 0, 320
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext1
    font_size = 20
    font_family = $font
    position = 0, 215
    halign = center
    valign = center
    shadow_passes = 2
}

# Avatar and greeting
image {
    monitor =
    path = ~/.face
    size = 112
    rounding = -1
    border_size = 3
    border_color = $lavender
    position = 0, 85
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = $subtext0
    font_size = 14
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = $lavender
    inner_color = $base
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">󰌾   Password</span>
    check_color = $peach
    fail_color = $red
    fail_text = <span foreground="##ed8796">$FAIL ($ATTEMPTS)</span>
    capslock_color = $yellow
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
}

# Below the password while Caps Lock is on (the field's border turns yellow
# too); lock-screen asks Hyprland about the main keyboard
label {
    monitor =
    text = cmd[update:500] lock-screen capslock
    color = $yellow
    font_size = 12
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 2
}

# What's playing, at the bottom: cover, title, artist, previous / play-pause /
# next and the position (lock-media, pkgs/scripts/lock-media.py). Without a
# player the labels are empty and the cover transparent. The image needs a
# path that exists from the start: with an empty one hyprlock skips every
# label's update ("a resource is still pending"), and the position stands still.
image {
    monitor =
    path = ~/.local/share/lock-media/blank.png
    reload_cmd = lock-media cover
    reload_time = 2
    size = 96
    rounding = 12
    border_size = 0
    position = 0, 190
    halign = center
    valign = bottom
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:2000] lock-media title
    color = $text
    font_size = 15
    font_family = $font
    position = 0, 155
    halign = center
    valign = bottom
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:2000] lock-media artist
    color = $subtext0
    font_size = 12
    font_family = $font
    position = 0, 130
    halign = center
    valign = bottom
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] lock-media position
    color = $overlay0
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
}

# The buttons: the glyph as a label, an invisible shape of a fingertip's
# size around it takes the click (as with the keyboard button below)
label {
    monitor =
    text = cmd[update:2000] lock-media button previous
    color = $subtext1
    font_size = 22
    font_family = $font Mono
    position = -70, 72
    halign = center
    valign = bottom
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] lock-media button toggle
    color = $lavender
    font_size = 26
    font_family = $font Mono
    position = 0, 70
    halign = center
    valign = bottom
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:2000] lock-media button next
    color = $subtext1
    font_size = 22
    font_family = $font Mono
    position = 70, 72
    halign = center
    valign = bottom
    shadow_passes = 2
}

shape {
    monitor =
    size = 64, 56
    color = rgba(00000000)
    border_size = 0
    onclick = lock-media previous
    position = -70, 62
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 64, 56
    color = rgba(00000000)
    border_size = 0
    onclick = lock-media toggle
    position = 0, 62
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 64, 56
    color = rgba(00000000)
    border_size = 0
    onclick = lock-media next
    position = 70, 62
    halign = center
    valign = bottom
}

# Touch mode: next to the password, shows or hides the on-screen keyboard,
# which types into it (lock-screen, pkgs/scripts/lock-screen.sh). Everything
# sits a bit above the middle so that the keyboard, in the lower third of a
# tablet's screen, leaves the password free.
# The icon only in the touch mode; the Mono font fits it into its cell,
# which the other cuts off on the right
label {
    monitor =
    text = cmd[update:0] lock-screen button
    color = $subtext0
    font_size = 36
    font_family = $font Mono
    position = 220, -60
    halign = center
    valign = center
    shadow_passes = 2
}

# What takes the touch: a fingertip's size around the icon, invisible (a
# click outside the touch mode does nothing). The icon has no onclick, or
# a touch on it would toggle twice.
shape {
    monitor =
    size = 100, 100
    color = rgba(00000000)
    border_size = 0
    onclick = lock-screen keyboard
    position = 220, -60
    halign = center
    valign = center
}
